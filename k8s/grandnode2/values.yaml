replicaCount: 4

image:
  repository: "my-ecr-or-dockerhub/grandnode2" # TODO: Replace with your image repository.
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

container:
  port: 8080

ingress:
  enabled: true
  host: "" # Set domain for production (e.g. grandnode2.example.com). Keep empty for ALB DNS testing.
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

resources:
  requests:
    cpu: "1000m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

probes:
  readiness:
    enabled: true
    type: tcp
    port: 8080
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  liveness:
    enabled: true
    type: tcp
    port: 8080
    path: /
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 6

deploymentStrategy:
  maxUnavailable: 0
  maxSurge: 1

autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2

env:
  ASPNETCORE_ENVIRONMENT: "Production"
  DB_CONNECTION_STRING: "mongodb://grandnodeadmin:ChangeMeMongoPass123@mongodb.grandnode2.svc.cluster.local:27017/grandnode2?authSource=grandnode2"
  CONNECTIONSTRINGS_MONGODB: "mongodb://grandnodeadmin:ChangeMeMongoPass123@mongodb.grandnode2.svc.cluster.local:27017/grandnode2?authSource=grandnode2"
  CONNECTIONSTRINGS_PROVIDER: "0"
  FEATURE_INSTALLER: "true"
